name: Cleanup Edge Images

on:
  workflow_run:
    workflows:
      - "Build & Publish Docker Image"
    types:
      - completed
    branches:
      - "main"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = 'animeworld-companion';
            const ownerType =
              context.payload.repository?.owner?.type ||
              context.payload.workflow_run?.repository?.owner?.type ||
              'User';
            const edgeShaTag = /^edge-[0-9a-f]{7}(?:-(?:amd64|arm64))?$/;

            // Short SHA of the run that just completed — keep its images alive.
            const currentSha = (
              context.payload.workflow_run?.head_sha ||
              context.sha ||
              ''
            ).slice(0, 7);

            async function listVersions() {
              const params = {
                package_type: 'container',
                package_name: packageName,
                per_page: 100,
              };
              if (ownerType === 'Organization') {
                return github.paginate(
                  github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
                  { org: owner, ...params },
                );
              }
              return github.paginate(
                github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
                { username: owner, ...params },
              );
            }

            async function deleteVersion(packageVersionId) {
              const params = {
                package_type: 'container',
                package_name: packageName,
                package_version_id: packageVersionId,
              };
              if (ownerType === 'Organization') {
                return github.rest.packages.deletePackageVersionForOrg({
                  org: owner,
                  ...params,
                });
              }
              return github.rest.packages.deletePackageVersionForUser({
                username: owner,
                ...params,
              });
            }

            const versions = await listVersions();
            const candidates = versions.filter((version) => {
              const tags = version.metadata?.container?.tags || [];
              // Only delete versions whose tags are all edge-SHA patterns
              // and none of them belong to the current run's SHA.
              return (
                tags.length > 0 &&
                tags.every((tag) => edgeShaTag.test(tag)) &&
                tags.every((tag) => !tag.includes(currentSha))
              );
            });

            if (!candidates.length) {
              core.info('No old edge SHA images to delete.');
              return;
            }

            for (const version of candidates) {
              const tags = version.metadata?.container?.tags || [];
              core.info(`Deleting package version ${version.id}: ${tags.join(', ')}`);
              await deleteVersion(version.id);
            }
